name: Test Action

on:
  push:
  pull_request:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Faultline AI Trust & Safety Scan (mock mode)
        uses: ./
        with:
          input: 'README.md'
          fail-on: 'critical'
          provider: 'mock'
